<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dannz shop</title>
    <style>
        /* CSS Sederhana agar tampilan rapi di HP */
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; text-align: center; }
        header { background-color: #333; color: white; padding: 20px; }
        .container { display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .produk-kard { background: white; padding: 20px; margin: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 85%; max-width: 300px; }
        .produk-kard img { width: 100%; border-radius: 8px; height: 200px; object-fit: cover; }
        .harga { color: #e44d26; font-size: 18px; font-weight: bold; margin: 10px 0; }
        .tombol-beli { display: inline-block; background-color: #25D366; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>Dannz shop</h1>
        <p>welcome to my shop :)</p>
    </header>

    <div class="container">
        <!-- Produk 1 -->
        <div class="produk-kard">
            <!-- Ganti URL gambar di bawah dengan foto produk Anda -->
            <img src="alight motion.jpg" alt="alight motion">
            <h3>am prem 1 bulan</h3>
            <p class="harga">Rp 10.000</p>
            <!-- Ganti nomor 628xxx dengan nomor WhatsApp Anda -->
            <a href="https://wa.me/qr/PSK5QCEI6IQVF1" class="tombol-beli" target="_blank">Beli via WA</a>
        </div>

        <!-- Produk 2 -->
        <div class="produk-kard">
            <img src="alight motion.jpg" alt="alight motion">
            <h3>am prem 1 tahun</h3>
            <p class="harga">Rp 20.000</p>
            <a href="https://wa.me/qr/PSK5QCEI6IQVF1" class="tombol-beli" target="_blank">Beli via WA</a>
        </div>
    </div>
    <header>
      <p>kalau gak bisa langsung chat aja no ini ya 085184391270</p>    
    </header>
</body>
</html>
